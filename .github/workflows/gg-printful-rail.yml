name: GOD GEAR Printful Rail (allowlist)
on:
  workflow_dispatch:
    inputs:
      op:
        description: "Operation"
        required: true
        type: choice
        options: [check, catalog, product]
      arg:
        description: "search term (catalog) or catalog product id (product)"
        required: false
        default: ""
permissions: {}
concurrency:
  group: gg-printful-rail
  cancel-in-progress: false
jobs:
  run:
    if: github.triggering_actor == 'youngfamilyllc1943-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate
        env: { OP: "${{ inputs.op }}", ARG: "${{ inputs.arg }}" }
        run: |
          [[ "$ARG" =~ ^[A-Za-z0-9\ ]{0,40}$ ]] || { echo "REJECTED arg"; exit 2; }
      - name: Read-only Printful calls (ids, names, counts, catalog data only)
        env: { T: "${{ secrets.PRINTFUL_TOKEN }}", OP: "${{ inputs.op }}", ARG: "${{ inputs.arg }}" }
        run: |
          set -uo pipefail
          T=$(printf '%s' "$T" | tr -d '[:space:]'); [ -n "$T" ] || { echo "no token"; exit 1; }
          S=18823775
          g(){ curl -sS -o r.json -w '%{http_code}' -H "Authorization: Bearer $T" -H "X-PF-Store-Id: $S" -H "User-Agent: GOD-GEAR-Rail" "https://api.printful.com$1"; }
          case "$OP" in
            check)
              c=$(g /stores); echo "::notice title=stores::HTTP $c $(jq -c '[.result[]?|{id,name,type}]' r.json)"
              c=$(g "/store/products?limit=100"); echo "::notice title=store-products::HTTP $c total=$(jq '.paging.total' r.json) $(jq -c '[.result[]?|{id,name,synced}]' r.json | head -c 3000)" ;;
            catalog)
              c=$(g /products); jq -c --arg q "$ARG" '[.result[]|select((.title+" "+.model+" "+(.brand//""))|ascii_downcase|contains($q|ascii_downcase))|{id,title,model,techniques:[.techniques[]?.key],files:[.files[]?.type]}]' r.json > out.json
              echo "::notice title=catalog::HTTP $c $(head -c 3500 out.json)" ;;
            product)
              [[ "$ARG" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED"; exit 2; }
              c=$(g /products/$ARG); echo "::notice title=product::HTTP $c $(jq -c '.result.product|{id,title,model,techniques:[.techniques[]?|{key,display_name}],files:[.files[]?|{type,title,additional_price}],options:[.options[]?|{id,title,type,values:(.values|tostring|.[0:400]),additional_price}]}' r.json | head -c 3800)"
              echo "::notice title=variants::$(jq -c '[.result.variants[]|{id,color,size,price}]|group_by(.color)|map({color:.[0].color,sizes:map(.size),ids:map(.id),price:.[0].price})' r.json | head -c 3800)" ;;
          esac
          rm -f r.json out.json
