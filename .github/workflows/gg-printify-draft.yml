name: GOD GEAR Printify Draft Builder (allowlist)

# Manual dispatch only, restricted to the approved YFE executor account.
# Creates ONE unpublished product in the GOD GEAR Printify shop from fixed, allowlisted inputs.
# It never calls the publish endpoint, never places orders, never deletes, and never prints account data.
# Shopify sync happens only by a separate, Founder-authorized publish step (not in this file).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = read-only dry run (default); create = create unpublished Printify product"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - create
          - catalog
      product:
        description: "Fixed product spec"
        required: true
        type: choice
        options:
          - gg-athletic-tee
      blueprint_id:
        description: "Printify blueprint ID (digits)"
        required: true
        default: "12"
      provider_id:
        description: "Printify print provider ID (digits; 0 = list providers and stop)"
        required: true
        default: "0"

permissions: {}

concurrency:
  group: gg-printify-rail
  cancel-in-progress: false

jobs:
  run:
    if: github.triggering_actor == 'youngfamilyllc1943-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHOP_ID: "29470786"
      # Allowlisted artwork: GOD GEAR master logo (G mark + wordmark + FAITH IN MOTION.), transparent print file in this repo.
      ART_FILE: "rail/art/gg-master-logo-print.png"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rail/art
      - name: Validate inputs (runs before any secret is read)
        env:
          MODE: ${{ inputs.mode }}
          PRODUCT: ${{ inputs.product }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
        run: |
          case "$MODE" in plan|create|catalog) ;; *) echo "REJECTED: mode"; exit 2 ;; esac
          case "$PRODUCT" in gg-athletic-tee) ;; *) echo "REJECTED: product not on allowlist"; exit 2 ;; esac
          [[ "$BP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: blueprint_id"; exit 2; }
          [[ "$PP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: provider_id"; exit 2; }
          if [ "$MODE" = "create" ] && [ "$PP" = "0" ]; then echo "REJECTED: create needs a provider_id"; exit 2; fi
          echo "inputs OK"

      - name: Check secret is set
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "CONTROLLED FAILURE: PRINTIFY_TOKEN secret is not set"; exit 1; fi

      - name: Build draft (never publishes)
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
          MODE: ${{ inputs.mode }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
        run: |
          set -euo pipefail
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          BASE=https://api.printify.com/v1
          api() { # method path [json-body-file]
            local m=$1 p=$2 b=${3:-}
            if [ -n "$b" ]; then
              code=$(curl -sS -o resp.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" -H "Content-Type: application/json" --data @"$b" "$BASE$p")
            else
              code=$(curl -sS -o resp.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" "$BASE$p")
            fi
            echo "$m $p -> HTTP $code"; echo "::notice title=api::$m $p -> HTTP $code"
            if [ "${code:0:1}" != "2" ]; then echo "::error title=printify::$(jq -c 'if type=="object" then (.errors // .error // keys) else "n/a" end' resp.json 2>/dev/null | head -c 600)"; rm -f resp.json; exit 1; fi
          }

          # Step 1: blueprint check (public catalog data)
          api GET "/catalog/blueprints/$BP.json"
          echo "::notice title=blueprint::$(jq -c '{id,title,brand,model}' resp.json)"

          # Step 2: providers (stop here if none chosen)
          if [ "$PP" = "0" ]; then
            api GET "/catalog/blueprints/$BP/print_providers.json"
            echo "::notice title=providers::$(jq -c '[.[] | {id,title,loc:.location.country}]' resp.json)"
            echo "STOP: choose provider_id and re-run"; exit 0
          fi

          if [ "$MODE" = "catalog" ]; then
            api GET "/catalog/blueprints/$BP/print_providers/$PP/variants.json"
            echo "::notice title=catalog::$(jq -c '[.variants[]|.options.color]|unique' resp.json)"
            echo "::notice title=sizes::$(jq -c '[.variants[]|.options.size]|unique' resp.json)"
            echo "::notice title=count::$(jq '.variants|length' resp.json)"
            exit 0
          fi

          # Step 3: variants -> GG ATHLETIC spec: Black, S-4XL, price ladder (cents) per Founder-approved Shopify draft
          if [ "$BP" = "12" ] && [ "$PP" = "410" ]; then
            # Verified in run 40817934554 (Bella+Canvas 3001, Printful provider, Black S-4XL).
            echo '{"variants":[{"id":18100,"options":{"color":"Black","size":"S"}},{"id":18101,"options":{"color":"Black","size":"M"}},{"id":18102,"options":{"color":"Black","size":"L"}},{"id":18103,"options":{"color":"Black","size":"XL"}},{"id":18104,"options":{"color":"Black","size":"2XL"}},{"id":18105,"options":{"color":"Black","size":"3XL"}},{"id":18106,"options":{"color":"Black","size":"4XL"}}]}' > resp.json
          else
            api GET "/catalog/blueprints/$BP/print_providers/$PP/variants.json"
          fi
          jq -c '[.variants[] | select((.options.color|ascii_downcase)=="black") | select(.options.size as $s | ["S","M","L","XL","2XL","3XL","4XL"] | index($s))]
                 | map({id, size: .options.size, price: ({"S":4900,"M":4900,"L":4900,"XL":4900,"2XL":5400,"3XL":5900,"4XL":6400}[.options.size]), is_enabled: true})' resp.json > variants.json
          echo "::notice title=variants::$(jq -c 'map({id,size,price})' variants.json)"
          n=$(jq 'length' variants.json)
          if [ "$n" -lt 4 ]; then echo "FAIL: provider lacks Black S-4XL coverage ($n matched)"; exit 1; fi

          if [ "$MODE" = "plan" ]; then echo "PLAN OK: $n variants would be created. No write performed."; exit 0; fi

          # Step 4: upload allowlisted artwork by URL
          base64 -w0 "$ART_FILE" > art.b64
          jq -n --rawfile c art.b64 '{file_name:"GG_MASTER_LOGO_PRINT.png", contents:$c}' > up.json
          api POST "/uploads/images.json" up.json
          IMG=$(jq -r '.id' resp.json); echo "::notice title=image::$IMG $(jq -c '{width,height}' resp.json)"

          # Step 5: create product (unpublished; publish endpoint is never called)
          jq -n --argjson bp "$BP" --argjson pp "$PP" --arg img "$IMG" --slurpfile v variants.json '{
            title: "GG ATHLETIC™ Everyday Tee",
            description: "FAITH IN MOTION.™ GOD GEAR™ gold and silver G mark and wordmark on the front. Made to order.",
            blueprint_id: $bp, print_provider_id: $pp,
            variants: ($v[0] | map({id, price, is_enabled})),
            print_areas: [{ variant_ids: ($v[0] | map(.id)),
              placeholders: [{ position: "front", images: [{ id: $img, x: 0.5, y: 0.45, scale: 0.75, angle: 0 }] }] }]
          }' > product.json
          api POST "/shops/$SHOP_ID/products.json" product.json
          echo "::notice title=created::id=$(jq -r '.id' resp.json) visible=$(jq -r '.visible' resp.json) enabled=$(jq '[.variants[]|select(.is_enabled)]|length' resp.json)"
          echo "::notice title=mockups::$(jq -c '[.images[] | select(.is_default or (.position=="front")) | .src][0:4]' resp.json)"
          rm -f resp.json
