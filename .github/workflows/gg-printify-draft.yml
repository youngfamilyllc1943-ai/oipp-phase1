name: GOD GEAR Printify Draft Builder (allowlist)

# Manual dispatch only, restricted to the approved YFE executor account.
# Creates at most ONE unpublished Printify product from a fixed spec file (rail/specs/*.json).
# Guards: shop verified as Shopify-connected, BMW blueprint allowlist, exact size coverage, duplicate guard.
# Never publishes, orders, deletes, or prints account data. Shopify sync is a separate workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = read-only dry run (default); create = create one unpublished Printify product"
        required: true
        type: choice
        default: plan
        options: [plan, create]
      product:
        description: "Fixed product spec"
        required: true
        type: choice
        options: [gg-athletic-tee]
      blueprint_id:
        description: "Printify blueprint ID (digits; 0 = list allowlisted heavyweight blueprints and stop)"
        required: true
        default: "0"
      provider_id:
        description: "Printify print provider ID (digits; 0 = list providers and stop)"
        required: true
        default: "0"

permissions:
  contents: read

concurrency:
  group: gg-printify-rail
  cancel-in-progress: false

jobs:
  run:
    if: github.triggering_actor == 'youngfamilyllc1943-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHOP_ID: "29470786"
    steps:
      - name: Validate inputs (runs before any secret is read)
        env:
          MODE: ${{ inputs.mode }}
          PRODUCT: ${{ inputs.product }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
        run: |
          case "$MODE" in plan|create) ;; *) echo "REJECTED: mode"; exit 2 ;; esac
          case "$PRODUCT" in gg-athletic-tee) ;; *) echo "REJECTED: product not on allowlist"; exit 2 ;; esac
          [[ "$BP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: blueprint_id"; exit 2; }
          [[ "$PP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: provider_id"; exit 2; }
          if [ "$MODE" = "create" ] && { [ "$BP" = "0" ] || [ "$PP" = "0" ]; }; then echo "REJECTED: create needs blueprint_id and provider_id"; exit 2; fi
          echo "inputs OK"
      - uses: actions/checkout@v4
      - name: Check secret is set
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "CONTROLLED FAILURE: PRINTIFY_TOKEN secret is not set"; exit 1; fi
      - name: Build draft (never publishes)
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
          MODE: ${{ inputs.mode }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
          SPEC: rail/specs/${{ inputs.product }}.json
        run: |
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w"
          export EVIDENCE="$RUNNER_TEMP/evidence"
          bash "$GITHUB_WORKSPACE/rail/printify_draft.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printify-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 90
