name: GOD GEAR Printify Draft Builder (allowlist)

# Manual dispatch only, restricted to the approved YFE executor account.
# Creates ONE unpublished product in the GOD GEAR Printify shop from fixed, allowlisted inputs.
# It never calls the publish endpoint, never places orders, never deletes, and never prints account data.
# Shopify sync happens only by a separate, Founder-authorized publish step (not in this file).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = read-only dry run (default); create = create unpublished Printify product"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - create
          - catalog
          - blueprints
          - audit
          - update
          - sync-draft
          - map
          - link-external
          - test-order
          - cancel-test
      product:
        description: "Fixed product spec"
        required: true
        type: choice
        options:
          - gg-athletic-tee
          - gg-athletic-tee-canon
          - gg-active-tee-bmw-raised
          - gg-move-hoodie-bmw-raised
          - gg-culture-cap-bmw-raised
      blueprint_id:
        description: "Printify blueprint ID (digits)"
        required: true
        default: "12"
      provider_id:
        description: "Printify print provider ID (digits; 0 = list providers and stop)"
        required: true
        default: "0"

permissions: {}

concurrency:
  group: gg-printify-rail
  cancel-in-progress: false

jobs:
  run:
    if: github.triggering_actor == 'youngfamilyllc1943-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHOP_ID: "29470786"
      # Allowlisted artwork: GOD GEAR master logo (G mark + wordmark + FAITH IN MOTION.), transparent print file in this repo.
      ART_FILE: "rail/art/gg-master-logo-print.png"
      CANON_TEE_ART: "rail/art/GG-LOGO-03-print.png"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rail/art
            rail/specs
            rail/tools
            rail/art/embroidery
      - name: Validate inputs (runs before any secret is read)
        env:
          MODE: ${{ inputs.mode }}
          PRODUCT: ${{ inputs.product }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
        run: |
          case "$MODE" in plan|create|catalog|blueprints|audit|update|sync-draft|map|link-external|test-order|cancel-test) ;; *) echo "REJECTED: mode"; exit 2 ;; esac
          case "$PRODUCT" in gg-athletic-tee|gg-athletic-tee-canon|gg-active-tee-bmw-raised|gg-move-hoodie-bmw-raised|gg-culture-cap-bmw-raised) ;; *) echo "REJECTED: product not on allowlist"; exit 2 ;; esac
          [[ "$BP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: blueprint_id"; exit 2; }
          [[ "$PP" =~ ^[0-9]{1,6}$ ]] || { echo "REJECTED: provider_id"; exit 2; }
          if [ "$MODE" = "create" ] && [ "$PP" = "0" ]; then echo "REJECTED: create needs a provider_id"; exit 2; fi
          echo "inputs OK"

      - name: Check secret is set
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "CONTROLLED FAILURE: PRINTIFY_TOKEN secret is not set"; exit 1; fi

      - name: Build draft (never publishes)
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          PRODUCT: ${{ inputs.product }}
          MODE: ${{ inputs.mode }}
          BP: ${{ inputs.blueprint_id }}
          PP: ${{ inputs.provider_id }}
        run: |
          set -euo pipefail
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          BASE=https://api.printify.com/v1
          api() { # method path [json-body-file]
            local m=$1 p=$2 b=${3:-}
            if [ -n "$b" ]; then
              code=$(curl -sS -o resp.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" -H "Content-Type: application/json" --data @"$b" "$BASE$p")
            else
              code=$(curl -sS -o resp.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" "$BASE$p")
            fi
            echo "$m $p -> HTTP $code"; [ -n "${QUIET:-}" ] || echo "::notice title=api::$m $p -> HTTP $code"
            if [ "${code:0:1}" != "2" ]; then echo "::error title=printify::$(jq -c 'if type=="object" then (.errors // .error // keys) else "n/a" end' resp.json 2>/dev/null | head -c 600)"; rm -f resp.json; exit 1; fi
          }

          # Step 1: blueprint check (public catalog data)
          api GET "/catalog/blueprints/$BP.json"
          echo "::notice title=blueprint::$(jq -c '{id,title,brand,model}' resp.json)"

          # Step 2: providers (stop here if none chosen)
          if [ "$PP" = "0" ]; then
            api GET "/catalog/blueprints/$BP/print_providers.json"
            echo "::notice title=providers::$(jq -c '[.[] | {id,title,loc:.location.country}]' resp.json)"
            echo "STOP: choose provider_id and re-run"; exit 0
          fi

          if [ "$MODE" = "cancel-test" ]; then
            TORDER=6ae4e2ad99f5711d28006ad0
            # Try multiple cleanup patterns in sequence
            api GET "/shops/$SHOP_ID/orders/$TORDER.json"
            echo "::notice title=order-state::$(jq -c '{id,status,on_hold:(.on_hold//null)}' resp.json | head -c 400)"
            for M in "DELETE /shops/$SHOP_ID/orders/$TORDER.json" "POST /shops/$SHOP_ID/orders/$TORDER/cancel.json"; do
              set -- $M; METH=$1; PATH_=$2
              code=$(curl -sS -o resp.json -w '%{http_code}' -X "$METH" -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" "$BASE$PATH_")
              echo "::notice title=try::$METH $PATH_ -> HTTP $code $(jq -c '.' resp.json 2>/dev/null | head -c 200)"
              [ "${code:0:1}" = "2" ] && break
            done
            exit 0
          fi
          if [ "$MODE" = "test-order" ]; then
            # Verifies Printify fulfillment accepts GG ATHLETIC canon product + variant.
            # Creates order in HOLD state (send_to_production=false → no printing, no billing), then cancels it.
            PRODUCT_ID=6ae41ac5cccda5b54006571c
            jq -n --arg pid "$PRODUCT_ID"               '{external_id:"GG-ATH-RAIL-VERIFY-001", label:"RAIL VERIFY — do not fulfill",
                line_items:[{product_id:$pid, variant_id:18102, quantity:1}],
                shipping_method:1, send_shipping_notification:false,
                address_to:{first_name:"Tellis", last_name:"Young", email:"youngfamilyllc1943@gmail.com", phone:"2602675149",
                  country:"US", region:"IN", address1:"PO Box 11843", city:"Fort Wayne", zip:"46860"}}' > o.json
            # First, dry-run cost estimate (no persisted order)
            echo "::notice title=step1::cost-estimate (no order created)"
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" -H "Content-Type: application/json" --data @o.json "$BASE/shops/$SHOP_ID/orders/shipping.json")
            echo "::notice title=shipping-rate::HTTP $code $(jq -c '.' resp.json | head -c 500)"
            # Then: create order in HOLD mode
            echo "::notice title=step2::create order (send_to_production=false → HOLD)"
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" -H "Content-Type: application/json" --data @o.json "$BASE/shops/$SHOP_ID/orders.json?send_to_production=false")
            echo "::notice title=order-create::HTTP $code $(jq -c '{id,status,msg:(.message//.error//.errors)}' resp.json 2>/dev/null | head -c 500)"
            if [ "${code:0:1}" = "2" ]; then
              OID=$(jq -r '.id' resp.json)
              # Cancel immediately to clean up
              code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" "$BASE/shops/$SHOP_ID/orders/$OID/cancel.json")
              echo "::notice title=order-cancel::HTTP $code order=$OID"
              echo "::notice title=VERIFIED::Printify accepts ATHLETIC canon product_id=$PRODUCT_ID variant_id=18102 — fulfillment path works"
            else
              echo "::notice title=FAILED::Printify rejected order; see order-create above"
            fi
            exit 0
          fi
          if [ "$MODE" = "link-external" ]; then
            # Experiment: try to directly PUT external on Printify draft to link to existing Shopify product.
            # SAFE: PUT only; no publish, no delete. On rejection, no state change.
            PRODUCT_ID=6ae41ac5cccda5b54006571c
            SHOPIFY_PRODUCT_ID=10249996501184
            SHOPIFY_HANDLE="gg-athletic-everyday-tee"
            jq -n --arg id "$SHOPIFY_PRODUCT_ID" --arg h "$SHOPIFY_HANDLE" '{external:{id:$id, handle:$h}}' > ext.json
            echo "::notice title=attempt::PUT external linkage to Shopify product $SHOPIFY_PRODUCT_ID"
            code=$(curl -sS -o resp.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" -H "Content-Type: application/json" --data @ext.json "$BASE/shops/$SHOP_ID/products/$PRODUCT_ID.json")
            echo "::notice title=result::HTTP $code"
            if [ "${code:0:1}" = "2" ]; then
              # Verify by re-reading
              api GET "/shops/$SHOP_ID/products/$PRODUCT_ID.json"
              echo "::notice title=verified-external::$(jq -c '.external' resp.json)"
            else
              echo "::notice title=rejected::$(jq -c '.' resp.json | head -c 500)"
            fi
            exit 0
          fi
          if [ "$MODE" = "map" ]; then
            # Export verified Printify variant map for ATHLETIC canon draft (variant_id, size, price, cost) — no writes
            api GET "/shops/$SHOP_ID/products/6ae41ac5cccda5b54006571c.json"
            echo "::notice title=athletic-map::$(jq -c '[.variants[]|select(.is_enabled)|{id, size:.title|split(" / ")|.[1], color:.title|split(" / ")|.[0], price, cost}]' resp.json)"
            echo "::notice title=athletic-images::$(jq -c '[.images[]|{src:.src, variant_ids, position:.position, is_default}]|.[0:6]' resp.json | head -c 2500)"
            echo "::notice title=athletic-print-areas::$(jq -c '.print_areas|map({variant_ids: (.variant_ids|length), placeholders: [.placeholders[]|{position, images:[.images[]|{id,x,y,scale,angle}]}]})' resp.json | head -c 2500)"
            exit 0
          fi
          if [ "$MODE" = "sync-draft" ]; then
            # Printify → Shopify as DRAFT (unpublished). Allowlisted products only.
            case "$PRODUCT" in gg-athletic-tee-canon) PID=6ae41ac5cccda5b54006571c ;; *) echo "REJECTED: sync-draft not approved for $PRODUCT"; exit 2 ;; esac
            # 1. Printify publishes to Shopify
            jq -n '{title:true, description:true, images:true, variants:true, tags:true, keyFeatures:true, shipping_template:true}' > pub.json
            api POST "/shops/$SHOP_ID/products/$PID/publish.json" pub.json
            # 2. Printify needs an explicit publishing_succeeded callback to clear its queue; we send after a short wait so Shopify has the product
            sleep 20
            SPID=""
            for i in 1 2 3 4 5; do
              api GET "/shops/$SHOP_ID/products/$PID.json"
              SPID=$(jq -r '.external.id // empty' resp.json)
              [ -n "$SPID" ] && break
              sleep 10
            done
            if [ -z "$SPID" ]; then echo "FAIL: no Shopify product id after publish"; exit 1; fi
            echo "::notice title=shopify-id::$SPID"
            jq -n --arg sid "$SPID" '{external:{id:$sid, handle:"god-gear"}}' > ok.json
            api POST "/shops/$SHOP_ID/products/$PID/publishing_succeeded.json" ok.json
            # 3. Force Shopify product to DRAFT status via Admin GraphQL
            T2="${SHOPIFY_TOKEN:-}"
            if [ -z "$T2" ]; then echo "::warning title=shopify::no SHOPIFY_TOKEN secret — Shopify side left in default (likely active). Set repo secret SHOPIFY_TOKEN to Admin API token with write_products"; exit 0; fi
            Q='mutation d($id:ID!){productUpdate(product:{id:$id,status:DRAFT}){product{id status handle} userErrors{field message}}}'
            BODY=$(jq -nc --arg q "$Q" --arg id "gid://shopify/Product/$SPID" '{query:$q, variables:{id:$id}}')
            code=$(curl -sS -o sh.json -w '%{http_code}' -X POST -H "X-Shopify-Access-Token: $T2" -H "Content-Type: application/json" --data "$BODY" "https://ggmovement818.myshopify.com/admin/api/2026-01/graphql.json")
            echo "::notice title=shopify-draft::HTTP $code $(jq -c '.data.productUpdate // .errors' sh.json 2>/dev/null | head -c 400)"
            exit 0
          fi
          if [ "$MODE" = "audit" ]; then
            # Read-only: provider, blueprint, cost vs price per variant, US shipping. One annotation per product.
            QUIET=1
            for PID in 6ae41ac5cccda5b54006571c 6ae4543e50d43121ba068196 6ae45451fc0f61752e04efce 6ae454283838eb14700212e1; do
              api GET "/shops/$SHOP_ID/products/$PID.json"; cp resp.json p.json
              B=$(jq .blueprint_id p.json); V=$(jq .print_provider_id p.json)
              api GET "/catalog/blueprints/$B/print_providers/$V/shipping.json"; cp resp.json s.json
              echo "::notice title=audit $PID::$(jq -c --slurpfile sh s.json '{t:.title,bp:.blueprint_id,pp:.print_provider_id,shopify_published:(.external!=null),ship_us:([$sh[0].profiles[]|select(.countries|index("US"))|{first:.first_item.cost,add:.additional_items.cost}]|unique),v:([.variants[]|select(.is_enabled)|[.title,.cost,.price]]|unique_by(.[0]|split(" / ")|map(select(test("^(XS|S|M|L|XL|[2-5]XL|One size)$")))) )}' p.json | head -c 3500)"
            done
            exit 0
          fi
          if [ "$MODE" = "blueprints" ]; then
            api GET "/catalog/blueprints.json"
            echo "::notice title=matches::$(jq -c '[.[] | select((.model|tostring|test("^(1717|18500|3001|3001T|3001Y|6245CM|6245)$")) or (.title|test("mbroider|puff|3d";"i"))) | {id,t:.title,b:.brand,m:.model}]' resp.json | head -c 60000)"
            exit 0
          fi
          if [ "$MODE" = "catalog" ]; then
            api GET "/catalog/blueprints/$BP/print_providers.json"
            echo "::notice title=providers::$(jq -c '[.[]|{id,title}]' resp.json)"
            api GET "/catalog/blueprints/$BP/print_providers/$PP/variants.json"
            echo "::notice title=positions::$(jq -c '[.variants[].placeholders[]?.position]|unique' resp.json)"
            echo "::notice title=catalog::$(jq -c '[.variants[]|.options.color]|unique' resp.json)"
            echo "::notice title=sizes::$(jq -c '[.variants[]|.options.size]|unique' resp.json)"
            echo "::notice title=count::$(jq '.variants|length' resp.json)"
            exit 0
          fi

          SPEC="rail/specs/$PRODUCT.json"
          if [ -f "$SPEC" ] && { [ "$MODE" = "create" ] || [ "$MODE" = "update" ]; }; then
            python3 -m pip install -q --break-system-packages pillow numpy
            BP=$(jq -r .blueprint_id "$SPEC"); PP=$(jq -r .provider_id "$SPEC")
            api GET "/catalog/blueprints/$BP/print_providers/$PP/variants.json"; cp resp.json cat.json
            : > areas.jsonl; : > vars.jsonl
            n=$(jq '.colors|length' "$SPEC")
            for i in $(seq 0 $((n-1))); do
              CN=$(jq -r ".colors[$i].name" "$SPEC"); HX=$(jq -r ".colors[$i].hex" "$SPEC")
              PH='[]'
              na=$(jq '.art|length' "$SPEC")
              for k in $(seq 0 $((na-1))); do
                POS=$(jq -r ".art[$k].position" "$SPEC"); Y0=$(jq -r ".art[$k].crop[0]" "$SPEC"); Y1=$(jq -r ".art[$k].crop[1]" "$SPEC")
                AF=$(jq -r ".art[$k].file // empty" "$SPEC")
                if [ -n "$AF" ]; then
                  TH=$(jq -r ".colors[$i].thread // .colors[$i].hex" "$SPEC")
                  python3 rail/tools/tonal.py "$AF" art_${i}_$k.png "$TH" recolor
                else
                  python3 rail/tools/tonal.py "$ART_FILE" art_${i}_$k.png "$HX" auto "$Y0" "$Y1"
                fi
                jq -n --rawfile c <(base64 -w0 art_${i}_$k.png) --arg f "GG_TONAL_${HX}_${POS}.png" '{file_name:$f, contents:$c}' > up.json
                api POST "/uploads/images.json" up.json; IMG=$(jq -r .id resp.json)
                PH=$(jq -c --arg img "$IMG" --argjson k "$k" --slurpfile s "$SPEC" '. + [{position:$s[0].art[$k].position, images:[($s[0].art[$k] | {x,y,scale,angle}) + {id:$img}]}]' <<<"$PH")
              done
              jq -c --arg c "$CN" --slurpfile s "$SPEC" '[.variants[] | select(.options.color==$c) | select(.options.size as $z | $s[0].sizes | index($z)) | {id, price: $s[0].prices[.options.size], is_enabled: true}]' cat.json > v_$i.json
              echo "::notice title=color::$CN $(jq length v_$i.json) sizes, positions $(jq -c 'map(.position)' <<<"$PH")"
              jq -c '.[]' v_$i.json >> vars.jsonl
              jq -c --argjson ph "$PH" '{variant_ids: map(.id), placeholders: $ph}' v_$i.json >> areas.jsonl
            done
            tot=$(wc -l < vars.jsonl); if [ "$tot" -gt 100 ] || [ "$tot" -lt 1 ]; then echo "FAIL: $tot variants (Printify limit 100)"; exit 1; fi
            jq -n --slurpfile s "$SPEC" --slurpfile v vars.jsonl --slurpfile a areas.jsonl '{title:$s[0].title, description:$s[0].description, blueprint_id:$s[0].blueprint_id, print_provider_id:$s[0].provider_id, variants:$v, print_areas:$a}' > product.json
            if [ "$MODE" = "update" ]; then
              UPID=$(jq -r '.product_id // empty' "$SPEC"); [ -n "$UPID" ] || { echo "FAIL: spec has no product_id"; exit 1; }
              api GET "/shops/$SHOP_ID/products/$UPID.json"; cp resp.json cur.json
              jq --slurpfile c cur.json '
                ([.variants[].id]) as $en
                | ([$c[0].variants[] | select(.id as $x | $en | index($x) | not)]) as $off
                | .variants += ($off | map({id, price, is_enabled:false}))
                | .print_areas[0].variant_ids += ($off | map(.id))' product.json > upd.json
              api PUT "/shops/$SHOP_ID/products/$UPID.json" upd.json
            else
              api POST "/shops/$SHOP_ID/products.json" product.json
            fi
            echo "::notice title=created::id=$(jq -r .id resp.json) enabled=$(jq '[.variants[]|select(.is_enabled)]|length' resp.json)"
            echo "::notice title=mockups::$(jq -c '[.images[] | select(.position=="front" or .position=="back") | .src][0:8]' resp.json)"
            rm -f resp.json; exit 0
          fi

          # Step 3: variants -> GG ATHLETIC spec: Black, S-4XL, price ladder (cents) per Founder-approved Shopify draft
          if [ "$BP" = "12" ] && [ "$PP" = "410" ]; then
            # Verified in run 40817934554 (Bella+Canvas 3001, Printful provider, Black S-4XL).
            echo '{"variants":[{"id":18100,"options":{"color":"Black","size":"S"}},{"id":18101,"options":{"color":"Black","size":"M"}},{"id":18102,"options":{"color":"Black","size":"L"}},{"id":18103,"options":{"color":"Black","size":"XL"}},{"id":18104,"options":{"color":"Black","size":"2XL"}},{"id":18105,"options":{"color":"Black","size":"3XL"}},{"id":18106,"options":{"color":"Black","size":"4XL"}}]}' > resp.json
          else
            api GET "/catalog/blueprints/$BP/print_providers/$PP/variants.json"
          fi
          jq -c '[.variants[] | select((.options.color|ascii_downcase)=="black") | select(.options.size as $s | ["S","M","L","XL","2XL","3XL","4XL"] | index($s))]
                 | map({id, size: .options.size, price: ({"S":4900,"M":4900,"L":4900,"XL":4900,"2XL":5400,"3XL":5900,"4XL":6400}[.options.size]), is_enabled: true})' resp.json > variants.json
          echo "::notice title=variants::$(jq -c 'map({id,size,price})' variants.json)"
          n=$(jq 'length' variants.json)
          if [ "$n" -lt 4 ]; then echo "FAIL: provider lacks Black S-4XL coverage ($n matched)"; exit 1; fi

          if [ "$MODE" = "plan" ]; then echo "PLAN OK: $n variants would be created. No write performed."; exit 0; fi

          # Step 4: upload allowlisted artwork by URL
          base64 -w0 "$CANON_TEE_ART" > art.b64
          jq -n --rawfile c art.b64 '{file_name:"GG-LOGO-03-print.png", contents:$c}' > up.json
          api POST "/uploads/images.json" up.json
          IMG=$(jq -r '.id' resp.json); echo "::notice title=image::$IMG $(jq -c '{width,height}' resp.json)"
          base64 -w0 rail/art/GG-LOGO-05-Gmark-sleeve.png > sl.b64
          jq -n --rawfile c sl.b64 '{file_name:"GG-LOGO-05-Gmark-sleeve.png", contents:$c}' > up2.json
          api POST "/uploads/images.json" up2.json
          SIMG=$(jq -r '.id' resp.json); echo "::notice title=sleeve-image::$SIMG"

          # Step 5: create product (unpublished; publish endpoint is never called)
          jq -n --argjson bp "$BP" --argjson pp "$PP" --arg img "$IMG" --arg simg "$SIMG" --slurpfile v variants.json '{
            title: "GOD GEAR™ Signature Tee — Silver & Gold + Sleeve G (CANON)",
            description: "FAITH IN MOTION.™ GOD GEAR™ canon silver and gold GOD GEAR™ wordmark (GG-LOGO-03) across the chest; canon G mark on the left sleeve. Made to order.",
            blueprint_id: $bp, print_provider_id: $pp,
            variants: ($v[0] | map({id, price, is_enabled})),
            print_areas: [{ variant_ids: ($v[0] | map(.id)),
              placeholders: [{ position: "front", images: [{ id: $img, x: 0.5, y: 0.3, scale: 0.85, angle: 0 }] },
                             { position: "left_sleeve", images: [{ id: $simg, x: 0.5, y: 0.5, scale: 0.6, angle: 0 }] }] }]
          }' > product.json
          api POST "/shops/$SHOP_ID/products.json" product.json
          echo "::notice title=created::id=$(jq -r '.id' resp.json) visible=$(jq -r '.visible' resp.json) enabled=$(jq '[.variants[]|select(.is_enabled)]|length' resp.json)"
          echo "::notice title=mockups::$(jq -c '[.images[] | select(.is_default or (.position=="front")) | .src][0:4]' resp.json)"
          rm -f resp.json
