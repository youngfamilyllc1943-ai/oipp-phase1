name: GOD GEAR Printify Rail (allowlist)

# Manual dispatch only (GitHub allows workflow_dispatch only for accounts with write access to this repo).
# Additionally restricted to the approved YFE executor account below.
# Fixed read-only operations. No order, publish, delete, create, upload or arbitrary-endpoint operation exists.
on:
  workflow_dispatch:
    inputs:
      op:
        description: "Operation"
        required: true
        type: choice
        options:
          - shops
          - providers
          - variants
      provider_id:
        description: "Print provider ID (variants only, digits)"
        required: false
        default: "0"

permissions: {}

concurrency:
  group: gg-printify-rail
  cancel-in-progress: false

jobs:
  run:
    if: github.triggering_actor == 'youngfamilyllc1943-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate inputs (runs before any secret is read)
        env:
          OP: ${{ inputs.op }}
          PID: ${{ inputs.provider_id }}
        run: |
          case "$OP" in shops|providers) ;; variants)
            if ! [[ "$PID" =~ ^[0-9]{1,6}$ ]] || [ "$PID" = "0" ]; then echo "REJECTED: provider_id must be digits"; exit 2; fi ;;
            *) echo "REJECTED: operation not on allowlist"; exit 2 ;;
          esac
          echo "inputs OK"
      - name: Check secret is set
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "CONTROLLED FAILURE: PRINTIFY_TOKEN secret is not set"; exit 1; fi
      - name: Call Printify (fixed GET endpoints only)
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
          OP: ${{ inputs.op }}
          PID: ${{ inputs.provider_id }}
        run: |
          set -euo pipefail
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          BASE=https://api.printify.com/v1
          case "$OP" in
            shops)     URL="$BASE/shops.json" ;;
            providers) URL="$BASE/catalog/blueprints/795/print_providers.json" ;;
            variants)
              if ! [[ "$PID" =~ ^[0-9]{1,6}$ ]] || [ "$PID" = "0" ]; then echo "REJECTED: provider_id must be digits"; exit 2; fi
              URL="$BASE/catalog/blueprints/795/print_providers/$PID/variants.json" ;;
            *) echo "REJECTED: operation not on allowlist"; exit 2 ;;
          esac
          code=$(curl -sS -o out.json -w '%{http_code}' -H "Authorization: Bearer $T" -H "User-Agent: GOD-GEAR-Rail" "$URL")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then rm -f out.json; echo "Request failed; response body withheld from public log"; exit 1; fi
          if [ "$OP" = "shops" ]; then
            # Account data is not printed in this public log: only a count and a yes/no check.
            echo "shop_count=$(jq 'length' out.json)"
            echo "god_gear_shop_connected=$(jq '[.[] | select(.id==29470786 and .sales_channel=="shopify")] | length > 0' out.json)"
          else
            # Public Printify catalog data only.
            jq -c '.' out.json
          fi
          rm -f out.json
